<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Common Room · 360°</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#131416;color:#fff8ed;font-family:Arial,"PingFang SC",sans-serif}canvas{position:fixed;inset:0;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}.veil{pointer-events:none;position:fixed;inset:0;background:linear-gradient(#100d0b92,transparent 29%,transparent 65%,#0c0b0ca3)}header{position:fixed;top:25px;left:4vw;right:4vw;display:flex;justify-content:space-between;align-items:center;gap:15px}.logo{font-size:12px;letter-spacing:.17em;font-weight:bold}.logo i{display:inline-grid;width:39px;height:39px;place-items:center;border:1px solid #fff6;border-radius:11px;margin-right:12px;font-size:24px;color:#ffa968;font-style:normal}.logo small{display:block;margin-left:56px;margin-top:-10px;font-weight:400;font-size:9px;color:#dfd4c4;letter-spacing:.13em}button{color:inherit;cursor:pointer}header button,.c button{border:1px solid #ffffff55;border-radius:12px;background:#131415a8;padding:11px 14px;font-size:13px;backdrop-filter:blur(14px)}header button{border-radius:99px}.intro{position:fixed;top:22%;left:4vw;pointer-events:none;text-shadow:0 2px 15px #301b1477;transition:opacity .3s}.intro small{letter-spacing:.24em;color:#ffcca7}.intro h1{font-size:clamp(48px,7vw,103px);letter-spacing:-.075em;line-height:.94;margin:20px 0}.intro p{font-size:13px;color:#fff0e0}.intro.fade{opacity:.18}.badge{position:fixed;top:125px;right:4vw;border-radius:14px;border:1px solid #ffffff35;background:#161719b0;padding:20px;width:220px;backdrop-filter:blur(15px)}.badge small{color:#e9aa7d;letter-spacing:.15em}.badge h3{font-weight:500;font-size:16px}.badge p{color:#ded3c6;line-height:1.8;font-size:11px}.controls{position:fixed;bottom:30px;left:4vw;right:4vw;display:flex;justify-content:space-between;align-items:end}.c{padding:15px;background:#141718a9;border:1px solid #ffffff38;border-radius:17px;backdrop-filter:blur(14px)}.c label{display:block;color:#d6c9ba;font-size:10px;letter-spacing:.2em;margin-bottom:12px}.c button{margin-right:5px}.c button:hover,header button:hover{background:#ffffff28}.c span{font-size:12px;padding:0 10px;font-variant-numeric:tabular-nums}.compass{width:82px;height:82px;border-radius:50%;border:1px solid #fff6;background:radial-gradient(circle,#e7a16d44 2%,transparent 7%),repeating-radial-gradient(circle,transparent 0 17px,#ffffff17 18px 19px);display:grid;place-items:center;position:relative}.compass:before{content:"N";position:absolute;top:6px;font-size:10px;color:#ffdcba}.needle{width:2px;height:47px;background:linear-gradient(#ffb478 50%,#fff9 50%)}.help{position:fixed;bottom:128px;left:4vw;color:#ffead0b0;font-size:11px}.cross{pointer-events:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border:1px solid #fffd;border-radius:50%}@media(max-width:660px){header{top:17px}.badge{display:none}.intro{top:24%}.intro h1{font-size:49px}.c{padding:10px}.c button{padding:9px}.c span{padding:0 4px}.compass{width:55px;height:55px}.needle{height:32px}.help{bottom:110px;font-size:10px}}
</style></head><body><canvas id="world"></canvas><div class="veil"></div><div class="cross"></div><header><div class="logo"><i>⌖</i> COMMON ROOM<small>IMMERSIVE SPACE STUDY</small></div><button id="full">⛶ 全屏</button></header><div class="intro" id="intro"><small>SPACE STUDY / 001</small><h1>THE<br>COMMON<br>ROOM<span style="color:#efa978">.</span></h1><p>站在空间正中央 · 转身看看后面</p></div><aside class="badge"><small>INTERACTIVE 360°</small><h3>共享交流空间</h3><p>根据现场照片还原：橘色阶梯座位、浅木色阶梯、海报墙、大屏幕和中央活动区域。</p><p>这是可自由转身的空间模型，非激光扫描。</p></aside><div class="help">↔ 拖动转身 · ↕ 抬头低头 · 滚轮缩放</div><div class="controls"><div class="c"><label>LOOK AROUND / 旋转视角</label><button id="left">←</button><button id="right">→</button><span id="deg">000°</span><button id="out">−</button><button id="in">＋</button><button id="reset">↺</button></div><div class="c compass"><div class="needle" id="needle"></div></div></div>
<script>
(()=>{const canvas=document.getElementById('world'),c=canvas.getContext('2d');const R=Math.PI/180;let w,h,yaw=0,pitch=0,fov=73,down=false,moved=false,lx=0,ly=0;const faces=[],text=[];const P=(x,y,z)=>({x,y,z});const F=(p,col)=>faces.push({p,col});const B=(x,y,z,dx,dy,dz,front,top,side)=>{let X=x+dx,Y=y+dy,Z=z+dz;F([P(x,y,z),P(X,y,z),P(X,Y,z),P(x,Y,z)],front);F([P(X,y,Z),P(x,y,Z),P(x,Y,Z),P(X,Y,Z)],front);F([P(x,y,Z),P(x,y,z),P(x,Y,z),P(x,Y,Z)],side||front);F([P(X,y,z),P(X,y,Z),P(X,Y,Z),P(X,Y,z)],side||front);F([P(x,Y,z),P(X,Y,z),P(X,Y,Z),P(x,Y,Z)],top||front)};const N=(p,s,color)=>text.push({p,s,color});function room(){F([P(-8,0,-7),P(-8,0,7),P(8,0,7),P(8,0,-7)],'#bba187');F([P(-8,4,-7),P(8,4,-7),P(8,4,7),P(-8,4,7)],'#e6dacf');F([P(-8,0,-7),P(8,0,-7),P(8,4,-7),P(-8,4,-7)],'#bc6c52');F([P(8,0,-7),P(8,0,7),P(8,4,7),P(8,4,-7)],'#b9654e');F([P(-8,0,7),P(-8,0,-7),P(-8,4,-7),P(-8,4,7)],'#ae604d');F([P(-8,0,7),P(-8,4,7),P(8,4,7),P(8,0,7)],'#b76653');
for(let x=-8;x<8;x++)for(let z=-7;z<7;z++)F([P(x,.002,z),P(x+1,.002,z),P(x+1,.002,z+1),P(x,.002,z+1)],(x*7+z*3)%5===0?'#c4a98e':'#c0a48a');
for(let i=0;i<4;i++){B(-7.8,0,-4.9-i*.54,11,.35+i*.37,.60,'#d77826','#f28e36','#c86e26');B(5.5+i*.56,0,-6.7,.62,.34+i*.36,10.4,'#dd7c2b','#ed913e','#c36a25');B(-5.3-i*.69,0,-6.4,.76,.39+i*.38,10.8,'#bd9569','#e2c49b','#aa8259')}
B(2.15,0,-6.95,.7,4,.5,'#ae5945','#b76e56');B(-7.95,0,-2.6,.7,4,.65,'#ac5947','#bc6a52');
const colors=['#24252b','#ece3d0','#373839','#decbc0','#253840','#e9d2b3','#222b30','#decab5','#2e3034','#a8c1ad','#ead7c7','#252829'];const names=['Moonshot','读书人','BARE','Film Club','Design','Tornado','Finance','Workshop','Culture','IDEAS','Art','Base Cup'];for(let i=0;i<13;i++){let x=-7.35+i*1.05;F([P(x,2.92,-6.97),P(x+.9,2.92,-6.97),P(x+.9,3.73,-6.97),P(x,3.73,-6.97)],colors[i%12]);N(P(x+.1,3.28,-6.96),names[i%12],i%2?'#2c2b2b':'#f6efe3')}
for(let i=0;i<8;i++){let z=-6.5+i*1.36;F([P(7.96,2.92,z),P(7.96,2.92,z+1.13),P(7.96,3.7,z+1.13),P(7.96,3.7,z)],colors[(i+3)%12])}
F([P(-2.6,1,6.94),P(2.6,1,6.94),P(2.6,3.45,6.94),P(-2.6,3.45,6.94)],'#e3d9d0');F([P(-2.48,1.14,6.90),P(2.48,1.14,6.90),P(2.48,3.3,6.90),P(-2.48,3.3,6.90)],'#11171a');B(-2.4,.05,6.68,.11,.98,.13,'#84878b');B(2.3,.05,6.68,.11,.98,.13,'#84878b');for(let i=0;i<8;i++){let x=3.1+i*.54;F([P(x,1.5,6.97),P(x+.43,1.5,6.97),P(x+.43,3.32,6.97),P(x,3.32,6.97)],i%2?'#e7e5dd':'#cfccc3')}
B(-6.5,0,6.75,1.5,3.5,.13,'#435157');for(let j=0;j<7;j++)B(-6.5+j*.2,0,6.62,.055,3.5,.11,'#34484d');for(let x=-6;x<7;x+=2.5)for(let z=-5;z<6;z+=3)B(x,3.97,z,.24,.02,.2,'#fff4e3','#fff4e3');B(-.6,3.95,-1,1.25,.03,.6,'#85868a');
const bags=[[-6.4,2,-2],[-5.1,1.2,1.4],[3.3,1.2,-5.5],[2.8,.7,-4.8],[6,.6,-3.1],[7,1.4,.5],[6,.65,2]];for(let i=0;i<bags.length;i++){let a=bags[i];B(a[0],a[1],a[2],.43,.4,.3,i%2?'#4e5054':'#2f4147','#737a7d')}}
room();function cam(p){let dx=p.x,dy=p.y-1.65,dz=p.z,a=yaw*R,b=pitch*R;let right=dx*Math.cos(a)+dz*Math.sin(a),front=dx*Math.sin(a)-dz*Math.cos(a);return{x:right,y:dy*Math.cos(b)-front*Math.sin(b),z:front*Math.cos(b)+dy*Math.sin(b)}}function clip(p){let o=[];for(let i=0;i<p.length;i++){let a=p[i],b=p[(i+1)%p.length],va=a.z>.1,vb=b.z>.1;if(va)o.push(a);if(va!==vb){let t=(.1-a.z)/(b.z-a.z);o.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t,z:.1})}}return o}function draw(){if(!w)return;let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#e9c7b1');g.addColorStop(1,'#8e705a');c.fillStyle=g;c.fillRect(0,0,w,h);let focal=w*.5/Math.tan(fov*R/2),layers=[];for(let f of faces){let p=clip(f.p.map(cam));if(p.length<3)continue;layers.push({p:p.map(q=>({x:w/2+q.x/q.z*focal,y:h/2-q.y/q.z*focal})),d:p.reduce((s,q)=>s+q.z,0)/p.length,col:f.col})}layers.sort((a,b)=>b.d-a.d);for(let f of layers){c.beginPath();c.moveTo(f.p[0].x,f.p[0].y);for(let i=1;i<f.p.length;i++)c.lineTo(f.p[i].x,f.p[i].y);c.closePath();c.fillStyle=f.col;c.fill()}for(let t of text){let p=cam(t.p);if(p.z<.2)continue;let sz=Math.max(7,Math.min(25,12/p.z*focal/500));c.font='bold '+sz+'px Arial';c.fillStyle=t.color;c.fillText(t.s,w/2+p.x/p.z*focal,h/2-p.y/p.z*focal,95)}}function size(){w=innerWidth;h=innerHeight;let d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;c.setTransform(d,0,0,d,0,0);draw()}function update(){yaw=(yaw%360+360)%360;document.getElementById('deg').textContent=String(Math.round(yaw)).padStart(3,'0')+'°';document.getElementById('needle').style.transform='rotate('+yaw+'deg)';document.getElementById('intro').classList.toggle('fade',moved);draw()}function turn(v){yaw+=v;moved=true;update()}canvas.addEventListener('pointerdown',e=>{down=true;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!down)return;yaw-=(e.clientX-lx)*.18;pitch=Math.min(49,Math.max(-49,pitch+(e.clientY-ly)*.11));lx=e.clientX;ly=e.clientY;moved=true;update()});canvas.addEventListener('pointerup',()=>down=false);canvas.addEventListener('pointercancel',()=>down=false);canvas.addEventListener('wheel',e=>{e.preventDefault();fov=Math.max(42,Math.min(100,fov+Math.sign(e.deltaY)*3));update()},{passive:false});document.getElementById('left').onclick=()=>turn(-30);document.getElementById('right').onclick=()=>turn(30);document.getElementById('in').onclick=()=>{fov=Math.max(42,fov-8);update()};document.getElementById('out').onclick=()=>{fov=Math.min(100,fov+8);update()};document.getElementById('reset').onclick=()=>{yaw=0;pitch=0;fov=73;moved=false;update()};document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')turn(-12);if(e.key==='ArrowRight')turn(12);if(e.key==='ArrowUp'){pitch-=7;update()}if(e.key==='ArrowDown'){pitch+=7;update()}if(e.key.toLowerCase()==='r')document.getElementById('reset').click()});addEventListener('resize',size);size()})();
</script></body></html>
